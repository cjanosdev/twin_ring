[package]
name = "twin_ring_exp"
version = "0.1.0"
edition = "2024"

[dependencies]
twin_ring_core = { path = "../twin_ring_core" }
tokio = { version = "1.47", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
anyhow = "1.0"
scylla = "0.12"
cassandra-cpp = "3.0"  # Rust bindings to Cassandra C++ driver
rand = { version = "0.9" }
rand_chacha = "0.9"
futures = "0.3"
hdrhistogram = "7"
csv = "1"
chrono = { version = "0.4", features = ["clock"] }